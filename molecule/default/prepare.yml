---
- name: molecule | Prepare
  hosts: all
  gather_facts: false

  tasks:
    - name: Prepare | Fix /etc/shadow permissions
      ansible.builtin.file:
        path: /etc/shadow
        mode: "0400"

    - name: Prepare | Ensure /etc/chrony directory exists
      ansible.builtin.file:
        path: /etc/chrony
        state: directory
        mode: "0755"
        owner: root
        group: root
      ignore_errors: true

    # Ubuntu 26.04+ and Debian 13+ chrony.service ships with
    # ConditionVirtualization=|!container which prevents chronyd
    # from starting inside Docker containers used by Molecule.
    - name: Prepare | Create systemd override directories for chrony
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      loop:
        - /etc/systemd/system/chrony.service.d
        - /etc/systemd/system/chronyd.service.d

    - name: Prepare | Override ConditionVirtualization for container testing
      ansible.builtin.copy:
        dest: "{{ item }}/override.conf"
        content: |
          [Unit]
          # Clear ConditionVirtualization for Molecule container testing.
          # Newer distros (Ubuntu 26.04+, Debian 13+) block chrony in containers.
          ConditionVirtualization=
          # Clear ConditionCapability=CAP_SYS_TIME for container testing.
          ConditionCapability=

          [Service]
          # Clear User= so chronyd runs as root (avoids "Not superuser" error).
          # Ubuntu 26.04+ sets User=_chrony which prevents clock operations.
          User=
          # Override service type for container testing compatibility.
          # Debian uses Type=notify, RHEL uses Type=forking — both conflict
          # with chronyd -n (foreground mode). Type=simple works universally.
          Type=simple
          # Unset NOTIFY_SOCKET so chronyd 4.8+ doesn't attempt to send readiness notifications
          # to an inactive systemd notification socket when Type=simple is used in containers.
          UnsetEnvironment=NOTIFY_SOCKET
          # Run chronyd in foreground (-n) free-running mode (-x) inside Molecule
          # containers. -n keeps chronyd in foreground (matches Type=simple).
          # -x avoids adjusting system clock (no CAP_SYS_TIME needed).
          ExecStart=
          ExecStart=/usr/sbin/chronyd -n -x $DAEMON_OPTS
          # Disable systemd sandboxing for container testing.
          # NOTE: an empty assignment (e.g. "ProtectSystem=") only resets LIST-type directives.
          # For boolean/enum directives systemd rejects it with "Invalid argument" and keeps the
          # vendor unit value — which, combined with the cleared LogsDirectory= below, left
          # /var/log read-only and crashed chronyd on startup (observed on ubuntu2604; other
          # matrix distros were unaffected). Always use explicit "=no" here.
          ProtectSystem=no
          ProtectHome=no
          PrivateTmp=no
          NoNewPrivileges=no
          ProtectKernelTunables=no
          ProtectControlGroups=no
          ProtectHostname=no
          ProtectKernelLogs=no
          ProtectKernelModules=no
          # Clear systemd-managed directories to prevent ownership conflicts.
          # With User= cleared, systemd would set these dirs to root:root,
          # conflicting with role's _chrony ownership.
          LogsDirectory=
          StateDirectory=
          RuntimeDirectory=
          ConfigurationDirectory=
        mode: "0644"
        owner: root
        group: root
      loop:
        - /etc/systemd/system/chrony.service.d
        - /etc/systemd/system/chronyd.service.d

    - name: Prepare | Reload systemd daemon after overrides
      ansible.builtin.systemd:
        daemon_reload: true
