---
# =============================================================================
# Ansible Role: Chrony - Default Variables
# =============================================================================
# This file defines default configuration values for the Chrony NTP role.
# These values can be overridden by setting them in your playbook or inventory.
#
# Supported OS distributions:
# - Ubuntu 26.04 (Resolute) and variants
# - Ubuntu 24.04 (Noble) and variants
# - Ubuntu 22.04 (Jammy) and variants
# - Debian 13 (Trixie) and variants
# - Debian 12 (Bookworm) and variants
# - Debian 11 (Bullseye) and variants
# - EL9: Rocky Linux 9, RHEL 9, AlmaLinux 9, CentOS Stream 9
#
# Sections:
#   1. General Settings
#   2. NTP Source Configuration
#   3. Security Settings
#   4. Leap Seconds Configuration
#   5. Logging Configuration
#   6. Logrotate Configuration
#   7. Real Time Clock (RTC) Settings
#   8. Hardware Timestamping Settings
#   9. System Performance Settings
#   10. NTP Client Options
# =============================================================================

# -----------------------------------------------------------------------------
# 1. General Settings
# -----------------------------------------------------------------------------
# Role execution control and basic service configuration

# Target lifecycle action executed by the role
# Valid values: all, prerequisites, install, configure, logrotate, upgrade
chrony_role_action: "all"

# Enable the chrony service on boot and keep it running (false stops and disables it)
# Valid values: true, false
chrony_service_enabled: true

# Configure log rotation policy for chrony log files
# Valid values: true, false
chrony_configure_logrotate: false

# Disable the NTP port (force chrony to operate as a client-only daemon)
# Valid values: true, false
chrony_port_disabled: false

# Enable binding command interface to specific addresses
# Valid values: true, false
chrony_bind_cmd_address_enable: true

# List of IP addresses to bind the command interface to
# Valid values: list of IP address strings (IPv4 or IPv6)
chrony_bind_cmd_addresses:
  - "127.0.0.1"
  - "::1"

# Run time synchronization verification after configuration
# Valid values: true, false
chrony_run_test: false

# -----------------------------------------------------------------------------
# 2. NTP Source Configuration
# -----------------------------------------------------------------------------
# Configure NTP servers and peers

# NTP source mode — how upstream sources are declared in chrony.conf
# Valid values: server, pool
chrony_ntp_source_mode: "server"

# List of NTP servers or pool addresses to synchronize with
# Valid values: list of strings formatted as '<address> [options]'
chrony_ntp_servers:
  - "0.pool.ntp.org iburst minpoll 4 maxpoll 8"
  - "1.pool.ntp.org iburst minpoll 4 maxpoll 8"
  - "2.pool.ntp.org iburst minpoll 4 maxpoll 8"
  - "3.pool.ntp.org iburst minpoll 4 maxpoll 8"

# Maximum root distance to allow clock synchronization (seconds)
# Valid values: float in seconds, greater than 0 and up to 16.0
chrony_maxdistance: 3.0

# Directory where NTS dump files and cookies are stored
# Valid values: absolute path string
chrony_ntsdumpdir: "/var/lib/chrony"

# Minimum number of sources required to synchronize system clock
# Valid values: integer between 1 and 10
chrony_num_minsources: 1

# Maximum allowed skew of system clock updates (ppm)
# Valid values: float in ppm, greater than 0 and up to 1000.0
chrony_maxupdateskew: 100.0

# Stepping behavior to correct clock skew immediately
# Valid values: space-separated string '<threshold> <limit>' (e.g. '1.0 3')
chrony_makestep: "1.0 3"

# NOTE: driftfile and keyfile paths are set per-OS in vars/{os_family}.yml
# as internal variables: __chrony_driftfile_path, __chrony_keyfile_path

# -----------------------------------------------------------------------------
# 3. Security Settings
# -----------------------------------------------------------------------------
# Access control, stratum, client access, and authentication settings

# Key ID used to authenticate chronyc command queries
# Valid values: positive integer greater than 0
chrony_command_key_id: 1

# Default access control policy for incoming NTP client queries
# Valid values: deny, allow
chrony_default_access: "deny"

# Enable local reference source to serve time when unsynchronized
# Valid values: true, false
chrony_local_stratum_enable: false

# Stratum level to report when operating locally unsynchronized
# Valid values: integer between 1 and 16
chrony_local_stratum: 10

# List of NTP clients allowed or denied access to this server
# Valid values: list of strings formatted as 'allow <net>' or 'deny <net>'
chrony_ntp_clients: []

# Client authentication configuration for NTP sources
# Valid values: dictionary with keys enable (bool), selectmode (require, prefer, ignore)
chrony_auth_settings:
  enable: false
  selectmode: "require"

# -----------------------------------------------------------------------------
# 4. Leap Seconds Configuration
# -----------------------------------------------------------------------------
# Configure timezone and slew rate for leap second corrections

# Timezone for leap seconds database (empty string disables handling)
# Valid values: timezone string (e.g. 'right/UTC', 'UTC') or empty string
chrony_leapsectz: "right/UTC"

# Leap seconds handling policy and slew rate settings
# Valid values: dictionary with keys mode (str), maxslewrate (float > 0), smoothtime (str)
chrony_leapsec_settings:
  mode: "slew"
  maxslewrate: 1000.0
  smoothtime: "400 0.001 leaponly"

# -----------------------------------------------------------------------------
# 5. Logging Configuration
# -----------------------------------------------------------------------------
# Configure log storage, log dir, and change thresholds

# Enable logging of chrony operational statistics and events
# Valid values: true, false
chrony_log_enable: true

# Absolute path to directory where chrony log files are saved
# Valid values: absolute path string
chrony_logdir_path: "/var/log/chrony"

# Space-separated list of log categories to record
# Valid values: space-separated tokens: measurements, statistics, tracking, rtc, refclocks, tempcomp
chrony_log_options: "measurements statistics tracking"

# Threshold for logging system clock update adjustments (seconds)
# Valid values: positive numeric string in seconds (e.g. '0.5')
chrony_logchange: "0.5"

# -----------------------------------------------------------------------------
# 6. Logrotate Configuration
# -----------------------------------------------------------------------------
# Configure log rotation policy for chrony log files

# Logrotate configuration options for managing chrony log retention
# Valid values: dictionary with keys archive_directory_path (str), frequency (enum),
#   count (int > 0), missingok (bool), compress (bool), nocreate (bool), copytruncate (bool), dateext (bool)
chrony_logrotate_options:
  archive_directory_path: "/var/log/chrony/archive"
  frequency: "daily"
  count: 30
  missingok: true
  compress: true
  nocreate: true
  copytruncate: false
  dateext: true

# -----------------------------------------------------------------------------
# 7. Real Time Clock (RTC) Settings
# -----------------------------------------------------------------------------
# Hardware RTC synchronization options

# Real-Time Clock (RTC) hardware synchronization options
# Valid values: dictionary with keys rtcsync_enable (bool), rtconutc_enable (bool),
#   rtcfile_enable (bool), rtcfile_path (str), rtcautotrim_enable (bool), rtcautotrim_interval (int), rtcdevice (str)
chrony_rtc_settings:
  rtcsync_enable: true
  rtconutc_enable: true
  rtcfile_enable: false
  rtcfile_path: "/var/lib/chrony/rtc"
  rtcautotrim_enable: false
  rtcautotrim_interval: 30
  rtcdevice: ""

# -----------------------------------------------------------------------------
# 8. Hardware Timestamping Settings
# -----------------------------------------------------------------------------
# Advanced hardware NIC timestamping and PPS options

# Hardware NIC timestamping and reference clock (PPS) settings
# Valid values: dictionary with keys enable_hw_timestamp (bool), hw_timestamp_interfaces (str),
#   refclock_enable (bool), refclock_pps (str), refclock_precision (str)
chrony_hardware_settings:
  enable_hw_timestamp: false
  hw_timestamp_interfaces: "*"
  refclock_enable: false
  refclock_pps: "/dev/pps0"
  refclock_precision: "1e-7"

# -----------------------------------------------------------------------------
# 9. System Performance Settings
# -----------------------------------------------------------------------------
# System dump directories and temp compensation

# System dump directories for clock state persistence
# Valid values: dictionary with key dumpdir (absolute path string)
chrony_system_settings:
  dumpdir: "/var/lib/chrony"

# Temperature compensation settings for hardware clock drift
# Valid values: dictionary with keys enable (bool), sensor_file (str), update_interval (int > 0), config_file (str)
chrony_temp_compensation:
  enable: false
  sensor_file: "/sys/class/thermal/thermal_zone0/temp"
  update_interval: 30
  config_file: "/etc/chrony/tempcomp"

# -----------------------------------------------------------------------------
# 10. NTP Client Options
# -----------------------------------------------------------------------------
# DHCP sourcing options and initstepslew thresholds

# NTP client integration options, DHCP sourcing, and initstepslew thresholds
# Valid values: dictionary with keys use_dhcp (bool), dhcp_sourcedir (str), conf_dir (str),
#   initstepslew (dict with threshold (int > 0), enable (bool))
chrony_client_settings:
  use_dhcp: false
  dhcp_sourcedir: "/run/chrony-dhcp"
  conf_dir: "/etc/chrony/conf.d"
  initstepslew:
    threshold: 30
    enable: true
