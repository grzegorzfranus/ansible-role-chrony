---
# ==============================================================================
# Workflow: Release
# ==============================================================================
# Purpose:
#   Runs Release Please on every push to main to open or update the release
#   pull request and to tag releases. When a release pull request is created
#   or updated, it validates the release branch, sets the Merge Check Gate
#   commit status on that pull request and deletes the CI runs GitHub holds
#   for approval there: pull_request runs of a pull request opened or updated
#   with GITHUB_TOKEN wait for an approval and fail once it is merged. When a
#   release is created, it publishes the role to Ansible Galaxy through
#   ansible-publish.yml.
#
# Triggers:
#   push: the main branch
# ==============================================================================

name: "Release"
run-name: "Release: ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ================================================================
  # 1. RELEASE PLEASE
  # ----------------------------------------------------------------
  # Analyzes Conventional Commits since last release and creates
  # or updates a Release PR. When the Release PR is merged, it
  # creates a Git tag and GitHub Release automatically.
  # ================================================================
  release-please:
    name: "📝 Run Release Please"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: "📝 Run Release Please"
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ================================================================
  # 2. VALIDATE RELEASE PR
  # ----------------------------------------------------------------
  # Runs CI checks on the Release PR branch and sets the required
  # "Merge Check" commit status via the GitHub API. This is needed
  # because the pull_request runs of PRs created or updated with
  # GITHUB_TOKEN wait for an approval instead of running. Those
  # runs are deleted, so they do not fail once the PR is merged.
  # ================================================================
  validate-release-pr:
    name: "🔍 Validate Release PR"
    needs: [release-please]
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - name: "🔍 Retrieve Release PR Details"
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          REPO="$GH_REPOSITORY"
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "release-please--branches--main" \
            --json number \
            --jq '.[0].number')
          PR_SHA=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json headRefOid \
            --jq '.headRefOid')
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$PR_SHA" >> "$GITHUB_OUTPUT"

      - name: "🧹 Delete Approval-Required CI Runs"
        if: steps.pr.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          # GitHub starts the pull_request runs of a pull request opened or
          # updated with GITHUB_TOKEN in an approval-required state. Nobody
          # approves them, so they fail once the release PR is merged; the
          # Merge Check Gate status replaces them. This step runs before that
          # status is published, so the release PR cannot be merged while the
          # run still exists, and it deletes the runs of the release PR head
          # in any status, including runs that have already expired.
          API="repos/$GH_REPOSITORY/actions/runs?branch=release-please--branches--main&event=pull_request&head_sha=$PR_SHA"
          RUN_IDS=""
          for attempt in $(seq 1 12); do
            RUN_IDS=$(gh api "$API" --jq '.workflow_runs[].id')
            if [[ -n "$RUN_IDS" ]]; then
              break
            fi
            echo "No pull_request run for $PR_SHA yet (attempt $attempt/12)"
            sleep 5
          done
          for RUN_ID in $RUN_IDS; do
            gh api --method DELETE "repos/$GH_REPOSITORY/actions/runs/$RUN_ID"
            echo "Deleted approval-required run $RUN_ID"
          done

      - name: "🔍 Checkout Release PR Branch"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: release-please--branches--main
          persist-credentials: false

      - name: "🔍 Validate YAML Syntax"
        run: pipx run yamllint==1.38.0 .

      - name: "🔍 Validate GitHub Actions"
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

      - name: "🔍 Validate Galaxy Metadata"
        run: |
          if [ ! -f meta/main.yml ]; then
            echo "::error::meta/main.yml is missing"
            exit 1
          fi
          python3 -c "
          import yaml, sys
          with open('meta/main.yml') as f:
              data = yaml.safe_load(f)
          gi = data.get('galaxy_info', {})
          errors = []
          for field in ['author', 'description', 'license', 'min_ansible_version']:
              if not gi.get(field):
                  errors.append(f'Missing required field: galaxy_info.{field}')
          desc = gi.get('description', '')
          if desc and len(desc) > 255:
              errors.append(f'Description too long: {len(desc)}/255 chars')
          if not gi.get('platforms'):
              errors.append('No platforms defined in galaxy_info')
          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print('Galaxy metadata validation passed')
          "

      - name: "✅ Publish Merge Check Status"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPOSITORY/statuses/$PR_SHA" \
            -f state=success \
            -f context="Merge Check Gate" \
            -f description="All validations passed (Release PR)"
          echo "Set 'Merge Check' status on commit $PR_SHA"

      - name: "❌ Publish Merge Check Failure Status"
        if: failure() && steps.pr.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPOSITORY/statuses/$PR_SHA" \
            -f state=failure \
            -f context="Merge Check Gate" \
            -f description="Release PR validation failed. See the linked Actions run." \
            -f target_url="$RUN_URL"
          echo "Set failing 'Merge Check' status on commit $PR_SHA"
          RUN_IDS=$(gh api "$API" --jq '.workflow_runs[].id')
          for RUN_ID in $RUN_IDS; do
            gh api --method DELETE "repos/$GH_REPOSITORY/actions/runs/$RUN_ID"
            echo "Deleted approval-required run $RUN_ID"
          done

  # ================================================================
  # 3. PUBLISH TO ANSIBLE GALAXY
  # ================================================================
  publish-to-galaxy:
    name: "Publish to Galaxy"
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: grzegorzfranus/github-workflows/.github/workflows/ansible-publish.yml@main
    secrets:
      galaxy-api-key: ${{ secrets.GALAXY_API_KEY }}
