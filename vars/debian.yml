---
# =============================================================================
# Ansible Role: Chrony - Debian Variables
# =============================================================================
# Debian-specific variables.
# These are NOT user-overridable. All use double-underscore prefix per Red Hat CoP — Variable Naming.
# =============================================================================

# -----------------------------------------------------------------------------
# Service Names
# -----------------------------------------------------------------------------

# Systemd unit name of the Chrony daemon on Debian/Ubuntu
__chrony_service_name: "chrony"

# Systemd unit name of the legacy NTP daemon, stopped during prerequisites
__chrony_ntp_service_name: "ntp"

# Systemd unit name of systemd-timesyncd, stopped during prerequisites
__chrony_timesyncd_service_name: "systemd-timesyncd"

# -----------------------------------------------------------------------------
# File Paths and Permissions
# -----------------------------------------------------------------------------

# Absolute path to chrony configuration file on Debian/Ubuntu
__chrony_config_path: "/etc/chrony/chrony.conf"

# Service user owning the Chrony log directory
# Note: Debian/Ubuntu package uses '_chrony', unlike RedHat/EL which uses 'chrony'
__chrony_log_directory_user: "_chrony"

# Absolute path to the Chrony drift file on Debian/Ubuntu
__chrony_driftfile_path: "/var/lib/chrony/chrony.drift"

# Absolute path to the Chrony authentication keys file on Debian/Ubuntu
__chrony_keyfile_path: "/etc/chrony/chrony.keys"

# Absolute path to the chronyd binary executable on Debian/Ubuntu
__chrony_binary_path: "/usr/sbin/chronyd"

# Absolute path to the Chrony configuration include directory on Debian/Ubuntu
__chrony_confdir_path: "/etc/chrony/conf.d"

# Package providing leap-second aware 'right/' timezone data on this distribution.
# Debian 13+ and Ubuntu 26.04+ split these zones out of the base tzdata package;
# on older releases they ship with tzdata and no extra package is needed.
# Valid values: package name string, or empty string when no extra package applies
__chrony_tzdata_legacy_package: >-
  {{ 'tzdata-legacy'
     if (
       (ansible_facts['distribution'] == 'Debian' and
        ansible_facts['distribution_major_version'] | int >= 13) or
       (ansible_facts['distribution'] == 'Ubuntu' and
        ansible_facts['distribution_major_version'] | int >= 26)
     )
     else '' }}

# Directories every supported distribution already allows chronyd to write to — either
# through LogsDirectory=/StateDirectory= in the packaged unit (Debian 12+, Ubuntu 24.04+),
# or because the unit's ProtectSystem= level does not cover /var (EL9, Debian 11) or grants
# /var/log explicitly (Ubuntu 22.04). Paths configured outside of these need an explicit
# ReadWritePaths= grant. Kept deliberately conservative: a redundant grant is harmless,
# a missing one crashes chronyd on startup.
# Valid values: list of absolute path strings
__chrony_unit_writable_paths:
  - "/var/log/chrony"
  - "/var/lib/chrony"
