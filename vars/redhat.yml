---
# =============================================================================
# Ansible Role: Chrony - RedHat Variables
# =============================================================================
# RedHat-specific variables.
# These are NOT user-overridable. All use double-underscore prefix per Red Hat CoP — Variable Naming.
# =============================================================================

# -----------------------------------------------------------------------------
# Service Names
# -----------------------------------------------------------------------------

# Systemd unit name of the Chrony daemon on EL9 / RedHat family
__chrony_service_name: "chronyd"

# Systemd unit name of the legacy NTP daemon, stopped during prerequisites
__chrony_ntp_service_name: "ntpd"

# Systemd unit name of systemd-timesyncd, stopped during prerequisites
__chrony_timesyncd_service_name: "systemd-timesyncd"

# -----------------------------------------------------------------------------
# File Paths and Permissions
# -----------------------------------------------------------------------------

# Absolute path to chrony configuration file on EL9 / RedHat family
__chrony_config_path: "/etc/chrony.conf"

# Service user owning the Chrony log directory on EL9 / RedHat family
__chrony_log_directory_user: "chrony"

# Absolute path to the Chrony drift file on EL9 / RedHat family
__chrony_driftfile_path: "/var/lib/chrony/drift"

# Absolute path to the Chrony authentication keys file on EL9 / RedHat family
__chrony_keyfile_path: "/etc/chrony.keys"

# Absolute path to the chronyd binary executable on EL9 / RedHat family
__chrony_binary_path: "/usr/sbin/chronyd"

# Absolute path to the Chrony configuration include directory on EL9 / RedHat family
__chrony_confdir_path: "/etc/chrony.d"
