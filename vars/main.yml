---
# =============================================================================
# Ansible Role: Chrony - Internal Variables
# =============================================================================
# Common variables shared across all distributions.
# These are NOT user-overridable. All use double-underscore prefix per Red Hat CoP — Variable Naming.
# =============================================================================

# Name of the Chrony package to install across distributions
__chrony_package_name: "chrony"

# Absolute path to the logrotate configuration file for Chrony
__chrony_logrotate_config_path: "/etc/logrotate.d/chrony"
